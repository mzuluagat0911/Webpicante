name: Motor de blog (SEO/GEO)

# Corre cada lunes 13:00 UTC (8am Colombia). Ajusta a tu gusto.
# También se lanza a mano desde la pestaña Actions → "Run workflow".
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "Qué ejecutar"
        required: true
        default: "run"
        type: choice
        options: [ideas, run]

# Necesario para que el robot pueda commitear los blogs a main.
permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del motor
        working-directory: motor
        run: npm install

      - name: Ejecutar agentes (idean + redactan + generan HTML)
        working-directory: motor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: "https://wearepicante.com"
          MAX_POSTS_PER_RUN: "1"
        run: npm run ${{ github.event.inputs.command || 'run' }}

      # Publica directo a main (full-auto). Vercel despliega en el push.
      - name: Publicar blogs (commit a main)
        run: |
          git config user.name "motor-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog en motor/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "blog: nuevos posts generados por el motor"
            git push
          fi
